<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://api.iconify.design/lucide:sun.png?color=%23ffd60a&width=180&height=180&background=%23d8ecff">
  <link rel="icon" type="image/png" href="https://api.iconify.design/lucide:sun.png?color=%23ffd60a&width=180&height=180&background=%23d8ecff">
  <meta name="theme-color" content="#f0f7ff">
  <style>
    :root {
      --bg: #f0f7ff;
      --card-bg: #ffffff;
      --border: #e0eeff;
      --primary: #ffd60a;
      --primary-hover: #ffca00;
      --text: #1d2d44;
      --muted: #6c7a89;
      --accent-blue: #d8ecff;
      --selected-blue: #0077ff;
      --selected-text: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Nunito", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      color: #1e3a8a;
      font-size: 1.6rem;
      margin-bottom: 20px;
      font-weight: 800;
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0, 119, 255, 0.05);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #3b82f6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .segmented-group {
      display: flex;
      gap: 6px;
      background-color: var(--bg);
      padding: 6px;
      border-radius: 18px;
      margin-bottom: 16px;
    }

    .segmented-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 4px;
      border-radius: 14px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .segmented-btn.selected {
      background-color: var(--primary);
      box-shadow: 0 4px 10px rgba(255, 214, 10, 0.4);
      transform: scale(1.05);
    }

    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip-btn {
      border: 2px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .chip-btn.selected {
      background-color: var(--selected-blue);
      color: var(--selected-text);
      border-color: var(--selected-blue);
      box-shadow: 0 4px 12px rgba(0, 119, 255, 0.25);
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary);
      color: #1e3a8a;
      border: none;
      padding: 16px;
      border-radius: 24px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255, 214, 10, 0.4);
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-secondary {
      flex: 1;
      background-color: var(--accent-blue);
      color: #1e3a8a;
      border: none;
      padding: 10px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .history-item {
      border-bottom: 2px solid var(--bg);
      padding: 12px 0;
    }

    .history-item:last-child { border-bottom: none; }

    .history-date {
      font-weight: 800;
      color: #3b82f6;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    .history-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .tag-badge {
      background-color: var(--bg);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>☀️ Morning Tracker</h1>

  <div class="card">
    <form id="surveyForm">

      <div class="section-title">Sleep Quality</div>
      <div class="segmented-group" id="qualityGroup">
        <button type="button" class="segmented-btn" data-val="😖">😖</button>
        <button type="button" class="segmented-btn" data-val="🥱">🥱</button>
        <button type="button" class="segmented-btn" data-val="😐">😐</button>
        <button type="button" class="segmented-btn selected" data-val="🙂">🙂</button>
        <button type="button" class="segmented-btn" data-val="😴">😴</button>
      </div>

      <div class="section-title">Morning Energy</div>
      <div class="segmented-group" id="energyGroup">
        <button type="button" class="segmented-btn" data-val="🪫">🪫</button>
        <button type="button" class="segmented-btn selected" data-val="⚡">⚡</button>
        <button type="button" class="segmented-btn" data-val="🚀">🚀</button>
      </div>

      <div class="section-title">Primary Position</div>
      <div class="segmented-group" id="orientationGroup">
        <button type="button" class="segmented-btn" data-val="⬆️">⬆️</button>
        <button type="button" class="segmented-btn" data-val="➡️">➡️</button>
        <button type="button" class="segmented-btn selected" data-val="⬅️">⬅️</button>
        <button type="button" class="segmented-btn" data-val="⬇️">⬇️</button>
        <button type="button" class="segmented-btn" data-val="🔄">🔄</button>
      </div>

      <div class="section-title">Awakenings</div>
      <div class="segmented-group" id="awakeningsGroup">
        <button type="button" class="segmented-btn selected" data-val="0">0</button>
        <button type="button" class="segmented-btn" data-val="1">1</button>
        <button type="button" class="segmented-btn" data-val="2">2</button>
        <button type="button" class="segmented-btn" data-val="3+">3+</button>
      </div>

      <div class="section-title">Temperature</div>
      <div class="segmented-group" id="tempGroup">
        <button type="button" class="segmented-btn" data-val="❄️">❄️</button>
        <button type="button" class="segmented-btn selected" data-val="🌿">🌿</button>
        <button type="button" class="segmented-btn" data-val="🌤️">🌤️</button>
        <button type="button" class="segmented-btn" data-val="🔥">🔥</button>
      </div>

      <div class="section-title">Discomfort Points</div>
      
      <div style="font-size: 0.8rem; color: var(--muted); margin-bottom: 6px;">🗣️ Head & Neck</div>
      <div class="chip-grid">
        <button type="button" class="chip-btn" data-type="pain" data-val="Head">Head</button>
        <button type="button" class="chip-btn" data-type="pain" data-val="Ear">Ear</button>
        <button type="button" class="chip-btn" data-type="pain" data-val="Neck">Neck</button>
      </div>

      <div style="font-size: 0.8rem; color: var(--muted); margin-bottom: 6px;">👕 Upper Body</div>
      <div class="chip-grid">
        <button type="button" class="chip-btn" data-type="pain" data-val="Shoulders">Shoulders</button>
        <button type="button" class="chip-btn" data-type="pain" data-val="Upper Back">Upper Back</button>
        <button type="button" class="chip-btn" data-type="pain" data-val="Arms">Arms</button>
      </div>

      <div style="font-size: 0.8rem; color: var(--muted); margin-bottom: 6px;">👖 Lower Body</div>
      <div class="chip-grid">
        <button type="button" class="chip-btn" data-type="pain" data-val="Lower Back">Lower Back</button>
        <button type="button" class="chip-btn" data-type="pain" data-val="Hips">Hips</button>
        <button type="button" class="chip-btn" data-type="pain" data-val="Knees">Knees</button>
      </div>

      <div class="section-title" style="margin-top: 16px;">🛌 Setup Used</div>
      <div class="chip-grid">
        <button type="button" class="chip-btn" data-type="setup" data-val="Single Pillow">Single Pillow</button>
        <button type="button" class="chip-btn" data-type="setup" data-val="Stacked Pillows">Stacked Pillows</button>
        <button type="button" class="chip-btn" data-type="setup" data-val="Knee Pillow">Knee Pillow</button>
        <button type="button" class="chip-btn" data-type="setup" data-val="Body Pillow">Body Pillow</button>
      </div>

      <button type="submit" class="submit-btn">Save Morning Log</button>

      <div class="actions">
        <button type="button" class="btn-secondary" id="exportCsvBtn">Export CSV</button>
        <button type="button" class="btn-secondary" id="exportJsonBtn">Export JSON</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="section-title">Past Entries</div>
    <div id="historyLog">No recorded logs yet.</div>
  </div>
</div>

<script>
  function setupSegmentedGroup(groupId) {
    const group = document.getElementById(groupId);
    group.addEventListener('click', (e) => {
      const btn = e.target.closest('.segmented-btn');
      if (!btn) return;
      group.querySelectorAll('.segmented-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  }

  setupSegmentedGroup('qualityGroup');
  setupSegmentedGroup('energyGroup');
  setupSegmentedGroup('orientationGroup');
  setupSegmentedGroup('awakeningsGroup');
  setupSegmentedGroup('tempGroup');

  document.querySelectorAll('.chip-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('selected');
    });
  });

  const form = document.getElementById('surveyForm');
  const historyLog = document.getElementById('historyLog');

  document.addEventListener('DOMContentLoaded', displayHistory);

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const getSelectedVal = (groupId) => document.querySelector(`#${groupId} .selected`)?.dataset.val || '';
    
    const selectedPains = Array.from(document.querySelectorAll('.chip-btn[data-type="pain"].selected')).map(b => b.dataset.val);
    const selectedSetup = Array.from(document.querySelectorAll('.chip-btn[data-type="setup"].selected')).map(b => b.dataset.val);

    const newEntry = {
      timestamp: new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
      date: new Date().toISOString().split('T')[0],
      quality: getSelectedVal('qualityGroup'),
      energy: getSelectedVal('energyGroup'),
      orientation: getSelectedVal('orientationGroup'),
      awakenings: getSelectedVal('awakeningsGroup'),
      temp: getSelectedVal('tempGroup'),
      pain: selectedPains.length ? selectedPains : ['None'],
      setup: selectedSetup.length ? selectedSetup : ['Standard']
    };

    const existingData = JSON.parse(localStorage.getItem('sleepSurveyLogs')) || [];
    existingData.unshift(newEntry);
    localStorage.setItem('sleepSurveyLogs', JSON.stringify(existingData));

    document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('selected'));
    displayHistory();
  });

  function displayHistory() {
    const logs = JSON.parse(localStorage.getItem('sleepSurveyLogs')) || [];
    if (logs.length === 0) {
      historyLog.innerHTML = '<p style="color: var(--muted); font-size: 0.9rem;">No entries logged yet.</p>';
      return;
    }

    historyLog.innerHTML = logs.map(entry => `
      <div class="history-item">
        <div class="history-date">${entry.timestamp}</div>
        <div style="font-size: 1.1rem; margin: 4px 0;">
          ${entry.quality} | ${entry.energy} | Position: ${entry.orientation} | Woke: ${entry.awakenings}x | ${entry.temp}
        </div>
        <div class="history-tags">
          ${entry.pain.map(p => `<span class="tag-badge" style="background:#ffebee; color:#c62828;">${p}</span>`).join('')}
          ${entry.setup.map(s => `<span class="tag-badge" style="background:#e8f5e9; color:#2e7d32;">${s}</span>`).join('')}
        </div>
      </div>
    `).join('');
  }

  document.getElementById('exportCsvBtn').addEventListener('click', function() {
    const logs = JSON.parse(localStorage.getItem('sleepSurveyLogs')) || [];
    if (!logs.length) return alert('No data to export!');

    const headers = ["Timestamp", "Date", "Quality", "Energy", "Orientation", "Awakenings", "Temperature", "Discomfort Points", "Setup Used"];
    const rows = logs.map(e => [
      `"${e.timestamp}"`,
      `"${e.date}"`,
      `"${e.quality}"`,
      `"${e.energy}"`,
      `"${e.orientation}"`,
      `"${e.awakenings}"`,
      `"${e.temp}"`,
      `"${e.pain.join('; ')}"`,
      `"${e.setup.join('; ')}"`
    ]);

    const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    downloadFile(csvContent, `sleep-log-${new Date().toISOString().split('T')[0]}.csv`, 'text/csv');
  });

  document.getElementById('exportJsonBtn').addEventListener('click', function() {
    const data = localStorage.getItem('sleepSurveyLogs') || '[]';
    downloadFile(data, `sleep-log-${new Date().toISOString().split('T')[0]}.json`, 'application/json');
  });

  function downloadFile(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
